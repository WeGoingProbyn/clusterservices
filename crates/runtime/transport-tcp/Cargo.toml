[package]
name = "cs-transport-tcp"
description = "TCP transport: tokio plus length-delimited framing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cs-transport.workspace = true
cs-util.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true

[dev-dependencies]
# The transport proves itself against the shared contract suite. Note the
# direction: the suite does not know this crate exists.
cs-testkit.workspace = true
cs-api.workspace = true
cs-engine.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
